<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090d16">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>Janusia Rudra — Studio Voice Cloning</title>
<style>
:root{
  --bg:#090d16; --card:#111827; --card2:#0d1422; --line:#1f2a3d; --ink:#f1f5f9; --muted:#94a3b8;
  --accent:#f97316; --accent2:#fb923c; --ok:#22c55e; --bad:#ef4444; --warn:#eab308;
  --font:Inter,"Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(1100px 520px at 85% -10%,rgba(249,115,22,.12),transparent 60%),var(--bg);color:var(--ink);font:15px/1.55 var(--font)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- gate ---------- */
#gate{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:radial-gradient(800px 460px at 50% 0%,rgba(249,115,22,.16),transparent 65%),var(--bg)}
.gbox{width:min(420px,100%);padding:30px 24px;border-radius:22px;background:linear-gradient(180deg,#131c2e,#0d1422);border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.6);text-align:center}
.glock{width:64px;height:64px;margin:0 auto 14px;border-radius:20px;display:grid;place-items:center;font-size:30px;background:rgba(249,115,22,.14);border:1px solid rgba(249,115,22,.4)}
.brand{font-weight:800;letter-spacing:.14em;font-size:15px;color:var(--accent)}
.gbox h1{margin:6px 0 4px;font-size:22px}
.gbox p{margin:0 0 18px;color:var(--muted);font-size:14px}
.pw{position:relative}
.pw input{width:100%;padding:14px 48px 14px 14px;border-radius:14px;border:1.5px solid var(--line);background:#0a111e;outline:none;font-size:16px;letter-spacing:.04em}
.pw input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(249,115,22,.18)}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;border-radius:10px;background:transparent;color:var(--muted);cursor:pointer;font-size:18px}
.gerr{min-height:22px;margin:10px 0 0;color:var(--bad);font-size:13.5px;font-weight:600}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* ---------- layout ---------- */
.nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:rgba(9,13,22,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .l{display:flex;align-items:center;gap:14px;min-width:0}
.nav .brand{font-size:16px;white-space:nowrap}
.nav a.back{color:var(--muted);font-size:13.5px;font-weight:600;white-space:nowrap}
.nav a.back:hover{color:var(--ink)}
.wrap{max-width:1100px;margin:0 auto;padding:18px 14px 60px;display:grid;gap:16px;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}
@media(max-width:860px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.card h2{margin:0 0 4px;font-size:17px;display:flex;align-items:center;gap:8px}
.card .sub{margin:0 0 14px;color:var(--muted);font-size:13px}
.full{grid-column:1/-1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:12px;border:1px solid var(--line);background:#16203a;color:var(--ink);font-weight:700;cursor:pointer;transition:transform .12s,background .15s;min-height:44px}
.btn:hover:not(:disabled){transform:translateY(-1px);background:#1b2848}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.pri{background:linear-gradient(135deg,var(--accent),#ea580c);border-color:transparent;color:#fff;box-shadow:0 10px 26px rgba(249,115,22,.3)}
.btn.sm{padding:7px 12px;min-height:36px;font-size:13px;border-radius:10px}
.btn.danger{color:#fca5a5}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.sb{justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700;background:#16203a;border:1px solid var(--line);color:var(--muted)}
.chip.ok{color:var(--ok)}.chip.bad{color:var(--bad)}.chip.warn{color:var(--warn)}.chip.acc{color:var(--accent2)}
label.f{display:grid;gap:6px;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:14px}
label.f select,textarea{width:100%;border-radius:12px;border:1.5px solid var(--line);background:#0a111e;padding:11px 12px;outline:none;color:var(--ink)}
label.f select:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:240px;resize:vertical;line-height:1.7;font-size:16px}
input[type=range]{width:100%;accent-color:var(--accent);height:6px}
.rv{color:var(--accent2);font-weight:800}

/* upload */
.drop{border:2px dashed #2a3957;border-radius:16px;padding:22px 14px;text-align:center;cursor:pointer;transition:.18s;background:var(--card2)}
.drop:hover,.drop.on{border-color:var(--accent);background:rgba(249,115,22,.07)}
.drop b{display:block;font-size:15px;margin-bottom:4px}
.drop small{color:var(--muted)}
.fileinfo{display:none;margin-top:12px;padding:12px;border-radius:14px;background:var(--card2);border:1px solid var(--line)}
.fileinfo.show{display:block}
audio{width:100%;margin-top:8px;border-radius:10px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0 14px}
@media(max-width:520px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{padding:9px 10px;border-radius:12px;background:var(--card2);border:1px solid var(--line)}
.stat small{display:block;color:var(--muted);font-size:11.5px;font-weight:700}
.stat b{font-size:17px}

/* progress */
.bar{height:12px;border-radius:99px;background:#0a111e;border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),#fbbf24);transition:width .25s}
.snip{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--card2);border:1px solid var(--line);color:#cbd5e1;font-size:14px;min-height:46px}
.log{margin-top:10px;max-height:150px;overflow:auto;font:12.5px/1.6 ui-monospace,Menlo,Consolas,monospace;color:var(--muted);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.log div.e{color:#fca5a5}.log div.o{color:#86efac}
.diag{margin-top:10px;padding:12px;border-radius:12px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.35);color:#fecaca;font-size:13.5px;display:none;white-space:pre-line}
.diag.show{display:block}
.out{display:none}.out.show{display:block}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);opacity:0;background:#fff;color:#0f172a;padding:10px 18px;border-radius:99px;font-weight:700;z-index:120;transition:.25s;pointer-events:none;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>

<!-- Password gate: studio DOM yahan tak exist hi nahi karta -->
<div id="gate" role="dialog" aria-modal="true" aria-labelledby="gT">
  <div class="gbox" id="gBox">
    <div class="glock" aria-hidden="true">🔒</div>
    <div class="brand">JANUSIA RUDRA</div>
    <h1 id="gT">Studio Locked</h1>
    <p>Voice cloning studio kholne ke liye master password daalo.</p>
    <div class="pw">
      <label class="sr" for="gPw">Password</label>
      <input id="gPw" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Master password">
      <button type="button" id="gEye" aria-label="Password dikhao / chhupao" title="Dikhao / Chhupao">👁️</button>
    </div>
    <div class="gerr" id="gErr" role="alert" aria-live="assertive"></div>
    <button class="btn pri" id="gGo" type="button" style="width:100%;margin-top:10px">🔓 Unlock Studio</button>
  </div>
</div>

<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ================= CONFIG (yahin se sab badlo) ================= */
const API_BASE   = "https://sangitadevi99as--janusia-voice-clone-voicecloner-web-app.modal.run";
const ENDPOINT   = "/clone";          // "/synthesize" ya "/generate" bhi ho sakta hai
const PASS_HASH  = "121fa2aef94dbce52432fe74be6d7fa4f97b09fb03e29f88c4a73e84d66ea4ee";   // SHA-256 (plain password code mein nahi hai)
const SESSION_KEY = "jn_rudra_session";
const CHUNK_MIN = 220, CHUNK_MAX = 250;        // characters per segment
const WPM = 135;                               // estimated speaking speed
const REQ_TIMEOUT_MS = 240000;                 // har segment ke liye (cold start ke liye lamba)
const RETRIES = 2;                             // har segment ke extra attempts
const MAX_REF_MB = 25;

/* ================= helpers ================= */
const $ = id => document.getElementById(id);
const enc = new TextEncoder();
async function sha256(str) {
  const buf = await crypto.subtle.digest("SHA-256", enc.encode(str));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}
function safeEq(a, b) { if (a.length !== b.length) return false; let r = 0; for (let i = 0; i < a.length; i++) r |= a.charCodeAt(i) ^ b.charCodeAt(i); return r === 0; }
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtT = s => { s = Math.max(0, Math.round(s || 0)); const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0"); };
const fmtB = n => n < 1048576 ? (n / 1024).toFixed(0) + " KB" : (n / 1048576).toFixed(1) + " MB";
let toastT = 0;
function toast(m) { const t = $("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 3000); }
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ================= password gate ================= */
let fails = 0, lockUntil = 0;
const sessionToken = () => sha256(PASS_HASH + "|" + navigator.userAgent + "|janusia-rudra-session");

async function tryUnlock() {
  const err = $("gErr"), inp = $("gPw");
  if (Date.now() < lockUntil) { err.textContent = "Bahut zyada galat try. " + Math.ceil((lockUntil - Date.now()) / 1000) + " sec baad dobara try karo."; return; }
  const v = inp.value;
  if (!v) { err.textContent = "Password daalo."; return; }
  $("gGo").disabled = true;
  try {
    const h = await sha256(v);
    if (safeEq(h, PASS_HASH)) {
      try { sessionStorage.setItem(SESSION_KEY, await sessionToken()); } catch (_) {}
      inp.value = ""; err.textContent = ""; fails = 0; openStudio();
    } else {
      fails++; err.textContent = "❌ Galat password. Dobara try karo." + (fails >= 5 ? " (30 sec ka wait)" : "");
      if (fails >= 5) { lockUntil = Date.now() + 30000; fails = 0; }
      const b = $("gBox"); b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake"); inp.select();
    }
  } catch (e) { err.textContent = "Is browser mein secure hashing available nahi hai (HTTPS zaroori)."; }
  finally { $("gGo").disabled = false; }
}
$("gGo").addEventListener("click", tryUnlock);
$("gPw").addEventListener("keydown", e => { if (e.key === "Enter") tryUnlock(); });
$("gPw").addEventListener("input", () => { $("gErr").textContent = ""; });
$("gEye").addEventListener("click", () => {
  const i = $("gPw"), show = i.type === "password"; i.type = show ? "text" : "password"; $("gEye").textContent = show ? "🙈" : "👁️"; i.focus();
});

function openStudio() { $("gate").style.display = "none"; buildStudio(); }
function lockStudio() {
  try { sessionStorage.removeItem(SESSION_KEY); } catch (_) {}
  Studio.destroy(); $("app").innerHTML = ""; $("gate").style.display = "grid"; $("gPw").value = ""; $("gPw").type = "password"; $("gEye").textContent = "👁️"; $("gErr").textContent = "";
  setTimeout(() => $("gPw").focus(), 50);
}
(async function boot() {
  try {
    const t = sessionStorage.getItem(SESSION_KEY);
    if (t && safeEq(t, await sessionToken())) { openStudio(); return; }
  } catch (_) {}
  $("gPw").focus();
})();

/* ================= smart text engine ================= */
function splitLong(s) {
  const out = [];
  while (s.length > CHUNK_MAX) {
    let cut = -1;
    for (let i = CHUNK_MAX; i >= CHUNK_MIN; i--) { if (",;:—–،".includes(s[i - 1])) { cut = i; break; } }
    if (cut < 0) { for (let i = CHUNK_MAX; i >= CHUNK_MIN; i--) { if (s[i] === " ") { cut = i; break; } } }
    if (cut < 0) cut = CHUNK_MAX;
    out.push(s.slice(0, cut).trim()); s = s.slice(cut).trim();
  }
  if (s) out.push(s);
  return out;
}
function chunkText(raw) {
  const text = String(raw || "").replace(/\r/g, "").replace(/[ \t]+/g, " ");
  const sentences = [];
  text.split(/\n+/).forEach(line => {
    line = line.trim(); if (!line) return;
    const m = line.match(/[^।॥.?!]+[।॥.?!]+["”’)\]]*|[^।॥.?!]+$/g) || [line];
    m.forEach(x => { x = x.trim(); if (x) sentences.push(x); });
  });
  const chunks = []; let cur = "";
  for (const s of sentences) {
    if (s.length > CHUNK_MAX) {
      if (cur) { chunks.push(cur); cur = ""; }
      const parts = splitLong(s); const last = parts.pop(); parts.forEach(p => chunks.push(p)); cur = last || "";
    } else if (!cur) cur = s;
    else if (cur.length + 1 + s.length <= CHUNK_MAX) cur += " " + s;
    else { chunks.push(cur); cur = s; }
  }
  if (cur) chunks.push(cur);
  if (chunks.length > 1) { const l = chunks[chunks.length - 1], p = chunks[chunks.length - 2]; if (l.length < 60 && p.length + 1 + l.length <= CHUNK_MAX + 20) { chunks.splice(chunks.length - 2, 2, p + " " + l); } }
  return chunks;
}

/* ================= audio helpers ================= */
function wavRate(buf) {   // WAV header se sample rate padho (taaki sab chunk ek hi rate par aayein)
  try {
    const dv = new DataView(buf); if (dv.byteLength < 44) return 0;
    const tag = (o) => String.fromCharCode(dv.getUint8(o), dv.getUint8(o + 1), dv.getUint8(o + 2), dv.getUint8(o + 3));
    if (tag(0) !== "RIFF" || tag(8) !== "WAVE") return 0;
    let o = 12;
    while (o + 8 <= dv.byteLength) { const id = tag(o), sz = dv.getUint32(o + 4, true); if (id === "fmt ") return dv.getUint32(o + 12, true); o += 8 + sz + (sz & 1); }
  } catch (_) {}
  return 0;
}
function toMonoInt16(ab) {
  const n = ab.length, ch = ab.numberOfChannels, out = new Int16Array(n), data = [];
  for (let c = 0; c < ch; c++) data.push(ab.getChannelData(c));
  for (let i = 0; i < n; i++) {
    let v = 0; for (let c = 0; c < ch; c++) v += data[c][i]; v /= ch;
    v = v < -1 ? -1 : v > 1 ? 1 : v; out[i] = v < 0 ? v * 32768 : v * 32767;
  }
  return out;
}
function buildWav(parts, rate) {   // 16-bit PCM mono WAV (memory-efficient: Blob parts)
  let samples = 0; parts.forEach(p => { samples += p.length; });
  const h = new ArrayBuffer(44), v = new DataView(h), w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, "RIFF"); v.setUint32(4, 36 + samples * 2, true); w(8, "WAVE"); w(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, "data"); v.setUint32(40, samples * 2, true);
  return { blob: new Blob([h, ...parts], { type: "audio/wav" }), samples };
}

/* ================= studio ================= */
const Studio = (() => {
  let ref = null, refUrl = "", outUrl = "", ctx = null, rate = 0, job = null, ctrl = null, running = false, wake = null, ui = {};
  const $q = id => document.getElementById(id);

  function log(msg, cls) { const l = $q("log"); if (!l) return; const d = document.createElement("div"); if (cls) d.className = cls; d.textContent = new Date().toLocaleTimeString("en-IN") + "  " + msg; l.appendChild(d); l.scrollTop = l.scrollHeight; }
  function diag(msg) { const d = $q("diag"); if (!d) return; d.textContent = msg || ""; d.classList.toggle("show", !!msg); }

  function updateText() {
    const t = $q("txt").value, chars = t.length, words = (t.trim().match(/\S+/g) || []).length, chunks = t.trim() ? chunkText(t).length : 0;
    $q("sChars").textContent = chars.toLocaleString("en-IN"); $q("sWords").textContent = words.toLocaleString("en-IN");
    $q("sDur").textContent = "~" + fmtT(words / WPM * 60); $q("sSeg").textContent = chunks;
  }
  async function setRef(file) {
    if (!file) return;
    if (!/^audio\//.test(file.type) && !/\.(wav|mp3|m4a|ogg|flac)$/i.test(file.name)) { toast("Sirf WAV / MP3 audio file chuno"); return; }
    if (file.size > MAX_REF_MB * 1048576) { toast("File " + MAX_REF_MB + " MB se chhoti rakho"); return; }
    ref = file; if (refUrl) URL.revokeObjectURL(refUrl); refUrl = URL.createObjectURL(file);
    $q("refInfo").classList.add("show"); $q("refName").textContent = file.name + " · " + fmtB(file.size); $q("refAudio").src = refUrl;
    $q("refDur").textContent = "Duration check…";
    try {
      const AC = window.AudioContext || window.webkitAudioContext, c = new AC(), ab = await c.decodeAudioData(await file.arrayBuffer()); c.close();
      const d = ab.duration; $q("refDur").innerHTML = "⏱ " + d.toFixed(1) + " sec " + (d < 6 ? '<span class="chip warn">bahut chhota — 10–30 sec behtar</span>' : d > 60 ? '<span class="chip warn">lamba — 10–30 sec kaafi hai</span>' : '<span class="chip ok">✓ sahi length</span>');
    } catch (_) { $q("refDur").textContent = "Audio decode nahi hua — doosri file try karo"; }
  }

  /* ---- server call ---- */
  function errExplain(status, msg, ms) {
    if (status === 0) return "Server tak request nahi pahunchi.\n• GPU server cold-start ho sakta hai (pehli request 30–90 sec leti hai) — dobara try karo.\n• Ya Modal app band/URL galat/CORS block ho sakta hai.\n• Internet check karo.";
    if (status === 404) return "Endpoint nahi mila (404). Code ke upar ENDPOINT = \"" + ENDPOINT + "\" ko \"/synthesize\" ya \"/generate\" karke try karo.";
    if (status === 405) return "Method allowed nahi (405). Endpoint ka path ya HTTP method backend se match nahi kar raha.";
    if (status === 413) return "File / data bahut bada (413). Reference audio chhota karo.";
    if (status === 422 || status === 400) return "Backend ne data reject kiya (" + status + "). Field names: speaker_wav, text, language, speed. " + (msg ? "\nServer: " + msg.slice(0, 200) : "");
    if (status === 401 || status === 403) return "Access denied (" + status + "). Backend par auth/CORS settings check karo.";
    if (status === 429) return "Bahut zyada requests (429). Thoda ruk kar resume karo.";
    if (status >= 500) return "GPU server error (" + status + "). " + (msg ? "\nServer: " + msg.slice(0, 200) : "") + "\nModal dashboard → Logs check karo; resume dabao.";
    return "Error " + status + (msg ? ": " + msg.slice(0, 200) : "");
  }
  async function readAudio(res) {
    const ct = (res.headers.get("content-type") || "").toLowerCase();
    if (ct.includes("json")) {
      const j = await res.json(), b64 = j.audio_base64 || j.audio || j.wav_base64;
      if (b64) { const bin = atob(String(b64).replace(/^data:[^,]+,/, "")), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u.buffer; }
      const url = j.audio_url || j.url; if (url) { const r2 = await fetch(url); if (!r2.ok) throw Object.assign(new Error("audio_url fetch fail"), { status: r2.status }); return await r2.arrayBuffer(); }
      throw Object.assign(new Error(j.error || j.detail || "Response mein audio nahi mila"), { status: 502 });
    }
    return await res.arrayBuffer();
  }
  async function synth(text, lang, speed, signal, onCold) {
    const fd = new FormData();
    fd.append("speaker_wav", ref, ref.name); fd.append("text", text); fd.append("language", lang); fd.append("speed", String(speed));
    const local = new AbortController(), kill = setTimeout(() => local.abort("timeout"), REQ_TIMEOUT_MS), cold = setTimeout(onCold, 9000);
    const onAbort = () => local.abort("user"); signal.addEventListener("abort", onAbort);
    try {
      const res = await fetch(API_BASE.replace(/\/+$/, "") + ENDPOINT, { method: "POST", body: fd, mode: "cors", signal: local.signal });
      if (!res.ok) { let m = ""; try { m = await res.text(); } catch (_) {} throw Object.assign(new Error(m || ("HTTP " + res.status)), { status: res.status, body: m }); }
      const buf = await readAudio(res);
      if (!buf || buf.byteLength < 1000) throw Object.assign(new Error("Khali / bahut chhota audio mila"), { status: 502 });
      return buf;
    } catch (e) {
      if (e.status) throw e;
      if (local.signal.aborted && local.signal.reason === "timeout") throw Object.assign(new Error("timeout"), { status: 504, timeout: true });
      if (signal.aborted) throw Object.assign(new Error("cancel"), { cancelled: true });
      throw Object.assign(new Error(e.message || "network"), { status: 0 });
    } finally { clearTimeout(kill); clearTimeout(cold); signal.removeEventListener("abort", onAbort); }
  }
  async function decode(buf) {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext, r = wavRate(buf) || 0;
      try { ctx = r >= 8000 && r <= 96000 ? new AC({ sampleRate: r }) : new AC(); } catch (_) { ctx = new AC(); }
      rate = ctx.sampleRate;
    }
    const ab = await ctx.decodeAudioData(buf.slice(0));
    return toMonoInt16(ab);
  }

  /* ---- main job ---- */
  function setRunning(b) {
    running = b; $q("go").disabled = b; $q("cancel").style.display = b ? "" : "none"; $q("go").textContent = b ? "⏳ Ban rahi hai…" : "🎙️ Voice Clone Karo";
    $q("resume").style.display = !b && job && job.done.some(x => !x) && job.done.some(x => x) ? "" : "none";
    if (b) { try { if (navigator.wakeLock) navigator.wakeLock.request("screen").then(w => { wake = w; }).catch(() => {}); } catch (_) {} }
    else if (wake) { try { wake.release(); } catch (_) {} wake = null; }
  }
  function progress(i, total, t0, snippet, extra) {
    const pct = total ? Math.round(i / total * 100) : 0;
    $q("bar").style.width = pct + "%"; $q("pct").textContent = pct + "%";
    $q("segTxt").textContent = i >= total ? "Poora hua ✅" : "Segment " + Math.min(total, i + 1) + " of " + total;
    const el = (Date.now() - t0) / 1000, eta = i > 0 ? el / i * (total - i) : 0;
    $q("timeTxt").textContent = "⏱ " + fmtT(el) + (i > 0 && i < total ? " · ETA ~" + fmtT(eta) : "");
    if (snippet != null) $q("snip").innerHTML = "🗣️ " + esc(snippet.length > 160 ? snippet.slice(0, 160) + "…" : snippet);
    if (extra) $q("snip").innerHTML += "<br><span class='chip warn' style='margin-top:6px'>" + esc(extra) + "</span>";
  }
  async function run(resume) {
    if (running) return;
    diag("");
    if (!ref) { toast("Pehle reference voice upload karo"); return; }
    const text = $q("txt").value;
    if (!resume) {
      if (!text.trim()) { toast("Script likho"); return; }
      const chunks = chunkText(text); if (!chunks.length) { toast("Script khali hai"); return; }
      job = { chunks, done: new Array(chunks.length).fill(null), lang: $q("lang").value, speed: +$q("speed").value, pause: +$q("pause").value, t0: Date.now() };
      ctx = null; rate = 0; $q("log").innerHTML = ""; $q("out").classList.remove("show");
      log("Script " + chunks.length + " segments mein baanta gaya (" + chunks.reduce((a, c) => a + c.length, 0).toLocaleString("en-IN") + " chars).");
    } else if (!job) return;
    job.pause = +$q("pause").value;
    ctrl = new AbortController(); setRunning(true); $q("progCard").style.display = "";
    const total = job.chunks.length; let doneCount = job.done.filter(Boolean).length;
    progress(doneCount, total, job.t0, "");
    try {
      for (let i = 0; i < total; i++) {
        if (job.done[i]) continue;
        if (ctrl.signal.aborted) throw Object.assign(new Error("cancel"), { cancelled: true });
        let ok = false, lastErr = null;
        for (let a = 0; a <= RETRIES && !ok; a++) {
          try {
            progress(doneCount, total, job.t0, job.chunks[i], a ? "Retry " + a + "/" + RETRIES : "");
            const t1 = Date.now();
            const buf = await synth(job.chunks[i], job.lang, job.speed, ctrl.signal, () => { progress(doneCount, total, job.t0, job.chunks[i], "GPU cold-start ho raha hai — 30–90 sec lag sakte hain…"); log("Server cold-start lag raha hai, intezaar…"); });
            job.done[i] = await decode(buf); ok = true; doneCount++;
            log("Segment " + (i + 1) + "/" + total + " ✓ (" + ((Date.now() - t1) / 1000).toFixed(1) + "s)", "o");
          } catch (e) {
            if (e.cancelled) throw e;
            lastErr = e; log("Segment " + (i + 1) + " fail: " + (e.timeout ? "timeout" : (e.status || "network")) + " " + String(e.message).slice(0, 80), "e");
            if (e.status === 404 || e.status === 405 || e.status === 422 || e.status === 400 || e.status === 413 || e.status === 401 || e.status === 403) break;   // retry se theek nahi hoga
            if (a < RETRIES) await sleep(2000 * (a + 1));
          }
        }
        if (!ok) { const e = lastErr || {}; throw Object.assign(new Error("segment-fail"), { status: e.timeout ? 504 : (e.status || 0), msg: e.body || e.message, seg: i + 1 }); }
        progress(doneCount, total, job.t0, job.chunks[i]);
      }
      finish();
    } catch (e) {
      if (e.cancelled) { log("Roka gaya. Ab tak ki segments save hain — Resume dabao.", "e"); toast("Roka gaya"); }
      else { diag("Segment " + (e.seg || "?") + " par ruk gaya.\n" + errExplain(e.status, e.msg) + "\n\n▶ “Resume” dabao — pehle ke " + doneCount + " segments dobara nahi banenge."); toast("Error — detail neeche"); }
    } finally { setRunning(false); }
  }
  function finish() {
    const total = job.chunks.length, gap = new Int16Array(Math.round(job.pause * rate)), parts = [];
    job.done.forEach((p, i) => { parts.push(p); if (i < total - 1 && gap.length) parts.push(gap); });
    const { blob, samples } = buildWav(parts, rate);
    if (outUrl) URL.revokeObjectURL(outUrl); outUrl = URL.createObjectURL(blob);
    $q("outAudio").src = outUrl; $q("dl").href = outUrl;
    const d = new Date(), p = n => String(n).padStart(2, "0");
    $q("dl").download = "janusia-rudra-" + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + "-" + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()) + ".wav";
    $q("outInfo").textContent = "⏱ " + fmtT(samples / rate) + " · " + fmtB(blob.size) + " · " + rate + " Hz · 16-bit PCM WAV";
    $q("out").classList.add("show"); progress(total, total, job.t0, "");
    log("Final WAV taiyaar: " + fmtT(samples / rate) + " (" + fmtB(blob.size) + ")", "o"); toast("✅ Voice taiyaar — Download karo");
    $q("out").scrollIntoView({ behavior: "smooth", block: "center" });
  }
  async function testServer() {
    const b = $q("test"); b.disabled = true; const t0 = Date.now(); diag("");
    log("Server test: " + API_BASE + " …");
    try {
      const c = new AbortController(), k = setTimeout(() => c.abort(), 90000);
      const r = await fetch(API_BASE.replace(/\/+$/, "") + "/", { method: "GET", mode: "cors", signal: c.signal }); clearTimeout(k);
      const s = ((Date.now() - t0) / 1000).toFixed(1);
      $q("srv").className = "chip ok"; $q("srv").textContent = "● Server online (" + r.status + ", " + s + "s)"; log("Server jawab diya: HTTP " + r.status + " in " + s + "s", "o"); toast("Server online ✅");
    } catch (e) {
      $q("srv").className = "chip bad"; $q("srv").textContent = "● Server nahi mila"; log("Server test fail: " + e.message, "e"); diag(errExplain(0));
    } finally { b.disabled = false; }
  }
  function destroy() {
    try { if (ctrl) ctrl.abort(); } catch (_) {}
    if (refUrl) URL.revokeObjectURL(refUrl); if (outUrl) URL.revokeObjectURL(outUrl);
    refUrl = outUrl = ""; ref = null; job = null; running = false;
    try { if (ctx) ctx.close(); } catch (_) {} ctx = null; rate = 0;
    try { if (wake) wake.release(); } catch (_) {} wake = null;
  }
  function bind() {
    $q("lock").addEventListener("click", lockStudio);
    const drop = $q("drop"), fi = $q("file");
    drop.addEventListener("click", () => fi.click());
    drop.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fi.click(); } });
    fi.addEventListener("change", () => setRef(fi.files[0]));
    ["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("on"); }));
    ["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("on"); }));
    drop.addEventListener("drop", e => setRef(e.dataTransfer.files[0]));
    $q("txt").addEventListener("input", updateText);
    $q("clear").addEventListener("click", () => { $q("txt").value = ""; updateText(); });
    $q("pause").addEventListener("input", () => { $q("pauseV").textContent = (+$q("pause").value).toFixed(2) + "s"; });
    $q("speed").addEventListener("input", () => { $q("speedV").textContent = (+$q("speed").value).toFixed(2) + "x"; });
    $q("go").addEventListener("click", () => run(false));
    $q("resume").addEventListener("click", () => run(true));
    $q("cancel").addEventListener("click", () => { if (ctrl) ctrl.abort(); });
    $q("test").addEventListener("click", testServer);
    $q("sample").addEventListener("click", () => { $q("txt").value = "नमस्ते दोस्तों, आपका स्वागत है जनुसिया स्टूडियो में। आज हम एक नई और दिलचस्प कहानी सुनने जा रहे हैं। कृपया ध्यान से सुनिए, क्योंकि यह आवाज़ पूरी तरह आपकी अपनी क्लोन की हुई आवाज़ है! क्या आप तैयार हैं?"; updateText(); });
  }
  function build() {
    $("app").innerHTML = `
<header class="nav">
  <div class="l"><span class="brand">JANUSIA RUDRA</span><a class="back" href="index.html">← Back to Home</a></div>
  <button class="btn sm" id="lock" type="button">🔒 Lock Studio</button>
</header>
<main class="wrap">
  <section class="card">
    <h2>🎤 Reference Voice</h2>
    <p class="sub">10–30 sec ka saaf WAV / MP3 sample (bina background music ke).</p>
    <div class="drop" id="drop" role="button" tabindex="0" aria-label="Reference audio upload karo">
      <b>📁 File yahan drop karo ya tap karke chuno</b><small>WAV · MP3 · max ${MAX_REF_MB} MB</small>
      <input id="file" class="sr" type="file" accept="audio/*,.wav,.mp3,.m4a,.ogg,.flac">
    </div>
    <div class="fileinfo" id="refInfo"><div id="refName" style="font-weight:700;word-break:break-all"></div><div id="refDur" class="sub" style="margin:4px 0 0"></div><audio id="refAudio" controls preload="metadata"></audio></div>
  </section>

  <section class="card">
    <h2>🎛️ Studio Controls</h2>
    <p class="sub">Language, pause aur speed set karo.</p>
    <label class="f">Language
      <select id="lang"><option value="hi">Hindi / Devanagari (Optimized)</option><option value="en">English (Indian Accent)</option></select>
    </label>
    <label class="f"><span>Natural Pause (segments ke beech): <span class="rv" id="pauseV">0.35s</span></span>
      <input id="pause" type="range" min="0.10" max="1.20" step="0.05" value="0.35"></label>
    <label class="f"><span>Speaking Speed: <span class="rv" id="speedV">1.00x</span></span>
      <input id="speed" type="range" min="0.75" max="1.30" step="0.05" value="1.00"></label>
    <div class="row sb"><span class="chip" id="srv">● Server status ?</span><button class="btn sm" id="test" type="button">🔌 Server Test</button></div>
  </section>

  <section class="card full">
    <div class="row sb"><h2 style="margin:0">📝 Script (Hindi / Hinglish / English)</h2><span class="row"><button class="btn sm" id="sample" type="button">Sample</button><button class="btn sm danger" id="clear" type="button">Saaf</button></span></div>
    <p class="sub" style="margin-top:4px">10–20 minute ki lambi script bhi paste kar sakte ho — apne-aap ${CHUNK_MIN}–${CHUNK_MAX} character ke segments mein tootegi (।  .  ?  ! par).</p>
    <textarea id="txt" spellcheck="false" placeholder="यहाँ अपनी स्क्रिप्ट लिखो या paste करो… नमस्ते दोस्तों। Aaj hum ek nayi kahani sunenge."></textarea>
    <div class="stats">
      <div class="stat"><small>Characters</small><b id="sChars">0</b></div>
      <div class="stat"><small>Words</small><b id="sWords">0</b></div>
      <div class="stat"><small>Est. Duration (~${WPM} wpm)</small><b id="sDur">~0:00</b></div>
      <div class="stat"><small>Segments</small><b id="sSeg">0</b></div>
    </div>
    <div class="row">
      <button class="btn pri" id="go" type="button" style="flex:1;min-width:220px">🎙️ Voice Clone Karo</button>
      <button class="btn" id="resume" type="button" style="display:none">▶ Resume</button>
      <button class="btn danger" id="cancel" type="button" style="display:none">⏹ Roko</button>
    </div>
    <div class="diag" id="diag" role="alert"></div>
  </section>

  <section class="card full" id="progCard" style="display:none">
    <div class="row sb"><h2 style="margin:0">⚙️ Progress</h2><span class="row"><span class="chip acc" id="segTxt">Segment 0 of 0</span><span class="chip" id="timeTxt">⏱ 0:00</span></span></div>
    <div class="row" style="flex-wrap:nowrap;margin-top:12px"><div class="bar" style="flex:1"><i id="bar"></i></div><b id="pct" style="min-width:44px;text-align:right">0%</b></div>
    <div class="snip" id="snip"></div>
    <div class="log" id="log" aria-live="off"></div>
  </section>

  <section class="card full out" id="out">
    <h2>✅ Final Audio</h2>
    <p class="sub" id="outInfo"></p>
    <audio id="outAudio" controls preload="auto"></audio>
    <div class="row" style="margin-top:12px"><a class="btn pri" id="dl" href="#" download="janusia-rudra.wav">⬇️ Download WAV</a></div>
  </section>
</main>`;
    bind(); updateText();
  }
  window.addEventListener("beforeunload", e => { if (running) { e.preventDefault(); e.returnValue = ""; } });
  return { build, destroy };
})();
function buildStudio() { Studio.build(); }
</script>
</body>
</html>
